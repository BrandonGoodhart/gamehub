<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e14">
<title>Game Forge — chat</title>
<meta name="description" content="Describe the website you want. It asks a few questions, builds it, and gives you the file.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230c0e14'/%3E%3Cpath d='M9 22l7-13 7 13z' fill='%236f8bff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body class="chat">

<header class="top"><div class="wrap">
  <a class="logo" href="index.html"><span class="mark"></span>Game Forge</a>
  <button class="btn" id="restart" type="button">Start over</button>
</div></header>

<div class="thread" id="thread"><div class="wrap" id="messages"></div></div>

<div class="composer"><div class="wrap">
  <label for="say" class="visually-hidden" style="position:absolute;left:-9999px">Your reply</label>
  <textarea id="say" rows="1" placeholder="Type your answer…" autocomplete="off"></textarea>
  <button class="send" id="send" type="button" aria-label="Send">&uarr;</button>
</div></div>

<script src="bank.js"></script>
<script src="runtime.js"></script>
<script src="generator.js"></script>
<script src="brain.js"></script>
<script src="site.js"></script>
<script src="chat.js"></script>
</body>
</html>
