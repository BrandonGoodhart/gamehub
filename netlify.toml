[build]
  command = "bun run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API redirects must come first so they aren't swallowed by the SPA fallback.
# (ace-chat declares its own path in code, so it needs no rule here.)
[[redirects]]
  from = "/api/generate-questions"
  to = "/.netlify/functions/generate-questions"
  status = 200

# theacechat.com serves the Ace app at its root, while the same deploy keeps
# serving the game hub on its own domain. Host-matched rules come before the
# SPA fallback, and exclude /api/* so the function stays reachable.
[[redirects]]
  from = "https://theacechat.com/api/*"
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://www.theacechat.com/api/*"
  to = "/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://theacechat.com/*"
  to = "/ace/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://www.theacechat.com/*"
  to = "/ace/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
