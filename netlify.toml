[build]
  command = "bun run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# API redirect must come first so it isn't swallowed by the SPA fallback
[[redirects]]
  from = "/api/generate-questions"
  to = "/.netlify/functions/generate-questions"
  status = 200

[[redirects]]
  from = "/api/forge-chat"
  to = "/.netlify/functions/forge-chat"
  status = 200

# Game Forge is a static page under /public, not a React route. Static files
# already win over non-forced redirects; this just covers the no-slash form.
[[redirects]]
  from = "/forge"
  to = "/forge/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
